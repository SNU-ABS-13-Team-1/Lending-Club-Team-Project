name: Notify Slack on main update

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          PUSHED_BY: ${{ github.actor }}
        run: |
          title=$(printf '%s' "$COMMIT_MESSAGE" | head -n1)
          payload=$(jq -n \
            --arg title "$title" \
            --arg url "$COMMIT_URL" \
            --arg author "$COMMIT_AUTHOR" \
            --arg pusher "$PUSHED_BY" \
            '{text: ":rocket: *main* 브랜치가 업데이트되었습니다.\n\($title)\n커밋 작성자: \($author) | push한 사람: \($pusher)\n\($url)"}')
          curl -sf -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
