# 프로젝트 공통 설정
# 팀에서 아직 확정하지 않은 항목은 값을 임의로 채우지 말고 TODO로 남겨둔다 (AGENTS.md 참고).
# 경로는 저장소 루트 기준 상대경로만 쓴다 — 팀원마다 클론 위치가 다르므로 절대경로 금지.
#
# 읽는 법: 이 파일을 직접 파싱하지 말고 `src/utils/config.py`의 load_config()를 쓴다.
#   from utils.config import load_config
#   cfg = load_config()          # 경로는 절대경로로 해석되고, split 합계 검증도 함께 수행됨
# 확인: python src/utils/config.py 를 실행하면 해석된 값이 출력된다.
#
# 적용 범위: 모형 학습·threshold 결정 등 **본 파이프라인** 코드가 대상이다.
#   (loader.py, preprocessor.py, model.py, realized_return.py, oof_diagnostics.py, sharpe_optimizer.py)
#
#   반면 src/analysis/의 탐색·검증용 스크립트는 이 설정을 따르지 않는다 — 의도된 차이다.
#   ① 처리 방식 간 AUC 상대 비교(자체 2분할 + 자체 seed 루프):
#      preprocessing_validation.py, missing_scheme_comparison.py, term_split_comparison.py,
#      t2_contribution_reassessment.py, macro_indicator_screening.py, auc_sample_filter_comparison.py
#   ② 실현수익률 검증(모형 학습 없음, pandas/numpy만 — 분할 자체가 없다):
#      realized_return_spec_check.py, realized_return_sensitivity.py
#   자세한 구분은 루트 AGENTS.md의 코드 색인 ②/③ 참고.

paths:
  data_raw: data/raw
  data_processed: data/processed
  outputs_reports: outputs/reports
  outputs_figures: outputs/figures

split:
  train: 0.6
  validation: 0.2
  test: 0.2

risk_free_rate:
  # 2026-07-29 회의 확정 (decision_log.md #18) — 참고논문 방식.
  # 거절한 대출의 자본은 "발행시점(issue_d)에 대출 만기(term)와 만기를 맞춘 미국채"에
  # 투자했다고 가정한다. 3년물(36개월) / 5년물(60개월).
  #   데이터: data/processed/us_treasury_GS3_GS5_monthly_2007-06_to_2020-09.csv
  #
  # 고정 상수가 아니므로 value는 null을 유지한다 — 채울 값이 없다.
  # issue_d × term 매칭 로직으로 처리하고, value를 읽어 쓰는 코드를 작성하지 않는다.
  method: issue_date_maturity_matched
  series: {36: GS3, 60: GS5}
  value: null

random_seed:
  # 기본 실행/디버깅용 단일 seed. src/analysis/AGENTS.md의 "30-seed 안정성 검증"(0~29 반복)과는
  # 목적이 다른 별개 설정이므로 혼동하지 않는다.
  #
  # ⚠️ 이 값은 **분할 매니페스트 파일명**도 결정한다
  #   (`data/processed/split_manifest_6_2_2_seed{default}.csv.gz`, `load_split_manifest()`).
  #   바꾸면 파이프라인이 다른 분할을 쓴다 — 산출물을 전부 다시 만들어야 한다.
  #
  # 2026-07-30: 42 → 20260730 으로 교체. 팀 공유용 데이터셋을 내보내면서 Test 20%를
  #   새로 랜덤분할했다. seed 42 매니페스트는 그대로 남아 있으나 더 이상 쓰지 않는다.
  default: 20260730
  stability_check_range: [0, 29]
