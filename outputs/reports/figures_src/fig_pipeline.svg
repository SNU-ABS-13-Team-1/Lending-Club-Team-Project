<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" width="620" height="440"
     font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/>
    </marker>
  </defs>

  <rect x="180" y="14" width="260" height="54" rx="6" fill="#eef1f5" stroke="#2c3e50" stroke-width="1.3"/>
  <text x="310" y="36" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">원본 대출 데이터</text>
  <text x="310" y="55" font-size="10.5" text-anchor="middle" fill="#5a6b7b">1,755,295건 · 2007-06~2020-09 발행</text>
  <line x1="310" y1="68" x2="310" y2="94" stroke="#2c3e50" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="16" y="96" width="588" height="232" rx="8" fill="#f7f9fb" stroke="#7f8c9b"
        stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="30" y="115" font-size="11.5" fill="#5a6b7b">Train / Validation — 모든 선택이 여기서 완결된다</text>

  <rect x="45" y="126" width="250" height="88" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.3"/>
  <text x="170" y="151" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">표본 필터</text>
  <text x="170" y="172" font-size="10.5" text-anchor="middle" fill="#5a6b7b">만기 도래 + 버퍼 6개월</text>
  <text x="170" y="190" font-size="11" text-anchor="middle" fill="#3d4a57">723,563건</text>
  <text x="170" y="207" font-size="10" text-anchor="middle" fill="#8a95a1">2장</text>

  <rect x="325" y="126" width="250" height="88" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.3"/>
  <text x="450" y="151" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">부도확률 모형</text>
  <text x="450" y="172" font-size="10.5" text-anchor="middle" fill="#5a6b7b">XGBoost · Train 내 3-fold OOF</text>
  <text x="450" y="190" font-size="10.5" text-anchor="middle" fill="#5a6b7b">isotonic 확률보정</text>
  <text x="450" y="207" font-size="10" text-anchor="middle" fill="#8a95a1">3장</text>

  <line x1="295" y1="170" x2="322" y2="170" stroke="#2c3e50" stroke-width="1.4" marker-end="url(#ar)"/>
  <polyline points="450,214 450,227 170,227 170,237" fill="none" stroke="#2c3e50" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="45" y="240" width="250" height="88" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.3"/>
  <text x="170" y="265" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">수익률 정의</text>
  <text x="170" y="286" font-size="10.5" text-anchor="middle" fill="#5a6b7b">건별 실현수익률 R · 초과수익 XR</text>
  <text x="170" y="304" font-size="10.5" text-anchor="middle" fill="#5a6b7b">E[XR] · Var[XR] · q_score</text>
  <text x="170" y="321" font-size="10" text-anchor="middle" fill="#8a95a1">4장</text>

  <rect x="325" y="240" width="250" height="88" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.3"/>
  <text x="450" y="265" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">승인 기준 τ* 확정</text>
  <text x="450" y="286" font-size="10.5" text-anchor="middle" fill="#5a6b7b">Validation 실현 Sharpe 최대화</text>
  <text x="450" y="304" font-size="10.5" text-anchor="middle" fill="#5a6b7b">50회 재분할 반복 검증</text>
  <text x="450" y="321" font-size="10" text-anchor="middle" fill="#8a95a1">5장</text>

  <line x1="295" y1="284" x2="322" y2="284" stroke="#2c3e50" stroke-width="1.4" marker-end="url(#ar)"/>

  <line x1="450" y1="328" x2="450" y2="360" stroke="#2c3e50" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="437" y="348" font-size="10.5" text-anchor="end" fill="#3d4a57">확정 모형 + τ* 재탐색 없이 1회 적용</text>

  <rect x="325" y="364" width="250" height="62" rx="6" fill="#f2ede4" stroke="#8a7454" stroke-width="1.3"/>
  <text x="450" y="388" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">외부 검증 표본 — 최종 성과</text>
  <text x="450" y="408" font-size="10.5" text-anchor="middle" fill="#5a6b7b">481,833건 · 학습·탐색 미사용 · 6장</text>

  <rect x="45" y="364" width="250" height="62" rx="6" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.1"/>
  <text x="170" y="388" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3d4a57">주 성과지표</text>
  <text x="170" y="408" font-size="10.5" text-anchor="middle" fill="#5a6b7b">Δ Sharpe = 모형 − 전부 승인</text>
</svg>
